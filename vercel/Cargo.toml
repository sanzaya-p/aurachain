[package]
name = "aurachain-node"
version = "1.0.0"
edition = "2021"
description = "AuraChain Quantum v1.0 serverless VPoS + L2 autonomous node for Vercel (Post-Quantum NIST FIPS 204 ML-DSA-44 + Ed25519)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = { version = "0.5", default-features = false, features = ["default-rng", "ml-dsa-44"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
vercel_runtime = "2"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "aurachain-node"
path = "src/main.rs"

[profile.release]
opt-level = 3
