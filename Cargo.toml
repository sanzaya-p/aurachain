[package]
name = "aurachain"
version = "1.1.0"
edition = "2021"
description = "AuraChain Quantum v1.1: Post-Quantum (NIST FIPS 204 ML-DSA-44 + Ed25519) fair-launch PoW -> VPoS L1 with BFT finality, .aura identities, Town Square, DEX, AUA royalty NFTs, DAO, and L2 Metropolis anchoring"
license = "MIT"
repository = "https://github.com/sanzaya-p/aurachain"
homepage = "https://aurachain-quantum.vercel.app"
keywords = ["blockchain", "post-quantum", "ml-dsa", "proof-of-stake", "rollup"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = { version = "0.5", default-features = false, features = ["default-rng", "ml-dsa-44"] }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[[bin]]
name = "aurachain"
path = "src/main.rs"

[profile.release]
opt-level = 3
