name: Autonomous Continuous Publisher & GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Regenerates live on-chain digest, RSS feed & AI/SEO sitemaps every 6 hours (24/7, $0.00)
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Generate Live Network Digest & Upload Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate live AuraChain Quantum digest, RSS & sitemaps (+ optional social syndication)
        env:
          AURA_NODE_URL: "https://aurachain-quantum.vercel.app"
          AURA_PORTAL_URL: "https://sanzaya-p.github.io/aurachain"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python3 scripts/generate_digest.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Launch Portal & Digest artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    name: Deploy Launch Portal & Digest to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub Actions artifact index consistency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 15); do
            FOUND=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo "0")
            if [ "${FOUND}" -ge 1 ]; then
              echo "Artifact 'github-pages' indexed in GitHub REST API on attempt ${attempt}."
              exit 0
            fi
            echo "Waiting for GitHub artifact index consistency (attempt ${attempt}/15)..."
            sleep 3
          done
          echo "Warning: proceeding to deploy-pages after waiting 45s."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
